<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>
  <style>
    body {
      background-color: #fafafa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    .login-box {
      background-color: white;
      padding: 40px;
      border: 1px solid #dbdbdb;
      text-align: center;
      width: 300px;
    }
    .login-box h2 {
      font-family: 'Segoe UI', sans-serif;
      margin-bottom: 20px;
      font-size: 28px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #dbdbdb;
      border-radius: 3px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #3897f0;
      color: white;
      border: none;
      border-radius: 3px;
      font-weight: bold;
      cursor: pointer;
    }
    .footer {
      margin-top: 20px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login</h2>
    <form id="loginForm" method="GET" action="">
      <input type="text" name="username" id="username" placeholder="Phone number, username, or email" required />
      <input type="password" name="password" id="password" placeholder="Password" required />
      <button type="submit">Log In</button>
    </form>
    <div class="footer">
      <p>Don't have an account? <a href="#">Sign up</a></p>
    </div>
  </div>

  <script>
    // Add event listener for form submission
    document.getElementById('loginForm').addEventListener('submit', function(event) {
      // Prevent the form from submitting (page reload)
      event.preventDefault();

      // Get input values
      var username = document.getElementById('username').value;
      var password = document.getElementById('password').value;

      // Output values in the console (for testing)
      console.log("Username:", username);
      console.log("Password:", password);

      // Optionally, you can add further actions, like form validation or sending data to a server
      // For example:
      if (username && password) {
        console.log('Login successful');
      } else {
        alert('Please enter both username and password');
      }
    });
  </script>
</body>
</html>
